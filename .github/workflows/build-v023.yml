name: Build v0.2.3 macOS 12 Intel compatibility DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test app and Agent with macOS 12 deployment target
        working-directory: ahakeyconfig-mac
        run: swift test --skip-update
      - name: Test VibeBar with macOS 12 deployment target
        working-directory: vibebar
        run: swift test --skip-update
      - name: Build Intel macOS 12 compatible app
        working-directory: ahakeyconfig-mac
        env:
          APP_VERSION: 0.2.3
          MACOS_DEPLOYMENT_TARGET: '12.0'
          BUILD_ARCHS: x86_64
          INSTALL_TO_APPLICATIONS: '0'
          REQUIRE_DEVELOPER_ID: '0'
        run: zsh scripts/build.sh
      - name: Verify actual Mach-O minimum versions and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          app='ahakeyconfig-mac/dist/AhaKey Studio.app'
          python3 build-support/macos12/audit_macho.py "$app" deliverables/macos12-binary-audit.json
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Package compatibility test DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v023-macos12-staging"
          ditto 'ahakeyconfig-mac/dist/AhaKey Studio.app' "$RUNNER_TEMP/v023-macos12-staging/AhaKey Studio.app"
          ln -s /Applications "$RUNNER_TEMP/v023-macos12-staging/Applications"
          hdiutil create -volname 'AhaKey 0.2.3 macOS12 Intel' -srcfolder "$RUNNER_TEMP/v023-macos12-staging" -ov -format UDZO deliverables/AhaKey-Studio-v0.2.3-macOS12-Intel-test.dmg
          hdiutil verify deliverables/AhaKey-Studio-v0.2.3-macOS12-Intel-test.dmg
          python3 - <<'PY'
          import json, pathlib, subprocess
          pathlib.Path('deliverables/build-info.json').write_text(json.dumps({
              'version':'0.2.3',
              'base_commit':'1b8882a5c7f546e60a1b868c16edbab46104184f',
              'compatibility_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'architectures':['x86_64'],
              'minimum_macos':'12.0',
              'target_system':'macOS 12.7.6 Intel',
              'runtime_test_host':'macOS 15 GitHub runner',
              'macos12_runtime_tested':False,
              'signing':'ad-hoc',
              'notarized':False
          },indent=2)+'\n')
          PY
          cd deliverables
          shasum -a 256 AhaKey-Studio-v0.2.3-macOS12-Intel-test.dmg > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AhaKey-v0.2.3-macOS12-Intel-test
          path: deliverables/*
          if-no-files-found: error
