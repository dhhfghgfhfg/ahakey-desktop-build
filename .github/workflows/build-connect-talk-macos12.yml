name: Build connect-talk macOS 12 Intel test package

on:
  push:
    branches:
      - codex/connect-talk-macos12-20261117

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Check out requested source branch
        uses: actions/checkout@v4
        with:
          repository: AhakeyAI/desktop
          ref: 8a42faed63e059b33bc71116cae47fb16de240f3
          fetch-depth: 0
      - name: Apply the prior macOS 12 compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Codex compatibility build'
          git config user.email 'codex-compat@example.invalid'
          git fetch https://github.com/dhhfghgfhfg/ahakey-desktop-build.git 56efe65b3713518ef69421673e919a720e3a3649
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "$conflicts" != 'ahakeyconfig-mac/Sources/AhaKeyConfigApp.swift' ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$conflicts"
              exit 1
            fi
            git show :2:ahakeyconfig-mac/Sources/AhaKeyConfigApp.swift > ahakeyconfig-mac/Sources/AhaKeyConfigApp.swift
            python3 - <<'PY'
          from pathlib import Path
          path = Path("ahakeyconfig-mac/Sources/AhaKeyConfigApp.swift")
          source = path.read_text()
          anchor = "final class AppDelegate: NSObject, NSApplicationDelegate, UNUserNotificationCenterDelegate {\n"
          addition = """    private var legacyStatusItem: NSStatusItem?

              private func installLegacyStatusMenuIfNeeded() {
                  if #available(macOS 13.0, *) { return }
                  let item = NSStatusBar.system.statusItem(withLength: NSStatusItem.squareLength)
                  item.button?.image = NSImage(systemSymbolName: "keyboard", accessibilityDescription: "AhaKey")
                  let menu = NSMenu()
                  let openItem = menu.addItem(withTitle: NSLocalizedString("打开主窗口", comment: ""), action: #selector(reopenMainWindow), keyEquivalent: "")
                  openItem.target = self
                  menu.addItem(.separator())
                  let quitItem = menu.addItem(withTitle: NSLocalizedString("退出 AhaKey Studio", comment: ""), action: #selector(NSApplication.terminate(_:)), keyEquivalent: "")
                  quitItem.target = NSApp
                  item.menu = menu
                  legacyStatusItem = item
              }

          """
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + addition)
          anchor = "        UNUserNotificationCenter.current().delegate = self"
          assert source.count(anchor) == 1
          source = source.replace(anchor, "        installLegacyStatusMenuIfNeeded()\n" + anchor)
          anchor = "    func reopenMainWindow() {"
          assert source.count(anchor) == 1
          source = source.replace(anchor, "    @objc func reopenMainWindow() {")
          path.write_text(source)
          PY
            git add ahakeyconfig-mac/Sources/AhaKeyConfigApp.swift
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          git status --short
      - name: Adapt newer timing APIs for macOS 12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("ahakeyconfig-mac/Sources/Shared")
          (base / "CompatDuration.swift").write_text("""
          import Foundation

          /// Duration used by code that must run on macOS 12.
          public struct CompatDuration: Sendable, Equatable {
              public let timeInterval: TimeInterval
              public static let zero = Self(timeInterval: 0)
              public static func seconds(_ value: Double) -> Self { Self(timeInterval: value) }
              public static func milliseconds(_ value: Double) -> Self { Self(timeInterval: value / 1_000) }
              public var nanoseconds: UInt64 { UInt64(max(0, timeInterval) * 1_000_000_000) }
              public static func += (lhs: inout Self, rhs: Self) { lhs = Self(timeInterval: lhs.timeInterval + rhs.timeInterval) }
          }
          """.lstrip())
          replacements = {
            "ApprovalRevocationFeedback.swift": [
              ("timeout: Duration = .seconds(8)", "timeout: CompatDuration = .seconds(8)"),
              ("Task.sleep(for: .milliseconds(250))", "Task.sleep(nanoseconds: 250_000_000)"),
              ("ContinuousClock.now.advanced(by: timeout)", "ProcessInfo.processInfo.systemUptime + timeout.timeInterval"),
              ("ContinuousClock.now < deadline", "ProcessInfo.processInfo.systemUptime < deadline"),
            ],
            "KimiDesktopLeverCoordinator.swift": [
              ("timeout: Duration = .seconds(5)", "timeout: CompatDuration = .seconds(5)"),
              ("Task.sleep(for: timeout)", "Task.sleep(nanoseconds: timeout.nanoseconds)"),
            ],
            "RestoreChannelAdmission.swift": [
              ("timeout: Duration = .seconds(5)", "timeout: CompatDuration = .seconds(5)"),
              ("Task.sleep(for: .milliseconds(50))", "Task.sleep(nanoseconds: 50_000_000)"),
              ("ContinuousClock.now.advanced(by: timeout)", "ProcessInfo.processInfo.systemUptime + timeout.timeInterval"),
              ("ContinuousClock.now < deadline", "ProcessInfo.processInfo.systemUptime < deadline"),
            ],
            "WS3MultitaskLightPreview.swift": [
              ("(Duration) async throws -> Void", "(CompatDuration) async throws -> Void"),
              ("Task.sleep(for: $0)", "Task.sleep(nanoseconds: $0.nanoseconds)"),
            ],
            "KimiDesktopPermissionBridge.swift": [
              ("ContinuousClock.now.advanced(by: .seconds(5))", "ProcessInfo.processInfo.systemUptime + 5"),
              ("ContinuousClock.now < deadline", "ProcessInfo.processInfo.systemUptime < deadline"),
              ("Task.sleep(for: .seconds(5))", "Task.sleep(nanoseconds: 5_000_000_000)"),
            ],
          }
          for filename, changes in replacements.items():
              path = base / filename
              data = path.read_text()
              for old, new in changes:
                  assert old in data, (filename, old)
                  data = data.replace(old, new)
              path.write_text(data)
          more = {
            "Utilities/AhaKeyFirmwareFlasher.swift": [
              ("ContinuousClock.now.advanced(by: .seconds(deviceWaitTimeout))", "ProcessInfo.processInfo.systemUptime + deviceWaitTimeout"),
              ("ContinuousClock.now < deadline", "ProcessInfo.processInfo.systemUptime < deadline"),
            ],
            "Utilities/StudioInspectorSession.swift": [
              ("timeout: Duration", "timeout: CompatDuration"),
              ("ContinuousClock.now.advanced(by: timeout)", "ProcessInfo.processInfo.systemUptime + timeout.timeInterval"),
              ("ContinuousClock.now < deadline", "ProcessInfo.processInfo.systemUptime < deadline"),
            ],
            "Utilities/StudioLCDInspectorModel.swift": [
              ("Task.sleep(for: .milliseconds(500))", "Task.sleep(nanoseconds: 500_000_000)"),
            ],
            "Utilities/StudioLegacyComponentWriter.swift": [
              ("Task.sleep(for: .milliseconds(50))", "Task.sleep(nanoseconds: 50_000_000)"),
            ],
            "Utilities/StudioInspectorSession+Device.swift": [
              ("Task.sleep(for: .milliseconds(100))", "Task.sleep(nanoseconds: 100_000_000)"),
            ],
            "Utilities/StudioLiveTaskSource.swift": [
              ("Task.sleep(for: .milliseconds(50))", "Task.sleep(nanoseconds: 50_000_000)"),
            ],
            "Utilities/StudioPresentationController.swift": [
              ("Task.sleep(for: .seconds(display.remaining))", "Task.sleep(nanoseconds: UInt64(max(0, display.remaining) * 1_000_000_000))"),
            ],
            "Utilities/TerminalForegroundSource.swift": [
              ("Task.sleep(for: .milliseconds(100))", "Task.sleep(nanoseconds: 100_000_000)"),
            ],
            "Views/AhaKeyStudioView.swift": [
              ("Task.sleep(for: .seconds(1))", "Task.sleep(nanoseconds: 1_000_000_000)"),
              ("Grid(alignment: .topLeading, horizontalSpacing: 10, verticalSpacing: 10) {", "VStack(alignment: .leading, spacing: 10) {"),
              ("GridRow(alignment: .top) {", "HStack(alignment: .top, spacing: 10) {"),
              ("Color.clear.gridCellUnsizedAxes([.horizontal, .vertical])", "Color.clear.frame(maxWidth: .infinity)"),
            ],
            "Views/WS3LightCatalogView.swift": [
              ("Grid(alignment: .leading, horizontalSpacing: 10, verticalSpacing: 8) {", "VStack(alignment: .leading, spacing: 8) {"),
              ("GridRow {", "HStack(spacing: 10) {"),
            ],
            "Views/StudioLeverPositionEditor.swift": [
              ("ViewThatFits(in: .horizontal) {\n                choiceRow(Choice.allCases)", "VStack(alignment: .leading, spacing: 8) {"),
            ],
            "Views/DeviceInfoView.swift": [
              ("        .formStyle(.grouped)\n", ""),
            ],
          }
          root = Path("ahakeyconfig-mac/Sources")
          for filename, changes in more.items():
              path = root / filename
              data = path.read_text()
              for old, new in changes:
                  assert old in data, (filename, old)
                  data = data.replace(old, new)
              path.write_text(data)
          tests = Path("ahakeyconfig-mac/Tests/AhaKeyConfigSharedTests/WS3MultitaskLightPreviewTests.swift")
          data = tests.read_text()
          assert "duration: Duration = .zero" in data
          data = data.replace("duration: Duration = .zero", "duration: CompatDuration = .zero")
          data = data.replace("Task.sleep(for: .seconds(100))", "Task.sleep(nanoseconds: 100_000_000_000)")
          tests.write_text(data)
          PY
      - name: Test app and VibeBar
        shell: bash
        run: |
          set -euo pipefail
          (cd ahakeyconfig-mac && swift test --skip-update)
          (cd vibebar && swift test --skip-update)
      - name: Build Intel app
        working-directory: ahakeyconfig-mac
        env:
          APP_BUNDLE_NAME: AhaKey Studio Connect Talk
          APP_DISPLAY_NAME: AhaKey Studio Connect Talk
          MACOS_DEPLOYMENT_TARGET: '12.0'
          BUILD_ARCHS: x86_64
          INSTALL_TO_APPLICATIONS: '0'
          REQUIRE_DEVELOPER_ID: '0'
        run: zsh scripts/build.sh
      - name: Audit and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          app='ahakeyconfig-mac/dist/AhaKey Studio Connect Talk.app'
          python3 build-support/macos12/audit_macho.py "$app" deliverables/macos12-binary-audit.json
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/connect-talk-macos12"
          ditto "$app" "$RUNNER_TEMP/connect-talk-macos12/AhaKey Studio Connect Talk.app"
          ln -s /Applications "$RUNNER_TEMP/connect-talk-macos12/Applications"
          hdiutil create -volname 'AhaKey Connect Talk macOS12 Intel' -srcfolder "$RUNNER_TEMP/connect-talk-macos12" -ov -format UDZO deliverables/AhaKey-Connect-Talk-macOS12-Intel-test.dmg
          hdiutil verify deliverables/AhaKey-Connect-Talk-macOS12-Intel-test.dmg
          ditto -c -k --sequesterRsrc --keepParent "$app" deliverables/AhaKey-Connect-Talk-macOS12-Intel-test.zip
          shasum -a 256 deliverables/*.dmg deliverables/*.zip > deliverables/SHA256SUMS
          printf '%s\n' 'Source: AhakeyAI/desktop connect&talk 8a42faed63e059b33bc71116cae47fb16de240f3' 'Compatibility base: 56efe65b3713518ef69421673e919a720e3a3649' 'Target: Intel macOS 12.7.6' 'Signing: ad-hoc, not notarized' 'Real macOS 12.7.6 runtime: not tested' > deliverables/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AhaKey-Connect-Talk-macOS12-Intel-test
          path: deliverables/*
          if-no-files-found: ignore

